plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases' } // Mod Menu
    maven { url = 'https://maven.shedaniel.me/' }               // Cloth Config
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "solace" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Client-only: in-game config screen via Mod Menu + Cloth Config (keeps the server jar clean).
    clientImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    // 26.1 requires Java 25. Gradle will provision it via the foojay toolchain resolver
    // (see settings.gradle) if no JDK 25 is installed on the machine.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}
