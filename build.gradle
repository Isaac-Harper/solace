plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    // Uploads releases to Modrinth (see the publishMods block at the bottom).
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

// Version carries the Minecraft version as build metadata (e.g. 1.0.0+26.1.2) so each MC port is a
// distinct jar / Modrinth version - Modrinth requires unique version numbers across ports.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases' } // Mod Menu
    maven { url = 'https://maven.shedaniel.me/' }               // Cloth Config
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "solace" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // `./gradlew runDemo` boots the client straight into the local demo world, used for
        // staging the gallery screenshots on the Modrinth page.
        demo {
            client()
            name = "Demo World"
            programArgs("--quickPlaySingleplayer", "New World")
        }
        // Headless in-world GameTests: boots a server, runs every @GameTest, exits.
        // ./gradlew runGametest   (results also written to build/gametest-junit.xml)
        gametest {
            server()
            name = "Game Test"
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-junit.xml"
            runDir "build/gametest"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Client-only: in-game config screen via Mod Menu + Cloth Config (keeps the server jar clean).
    clientImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // In-world tests: Fabric GameTest API. Not in the fabric-api bundle on 26.2, so declared here;
    // it carries its own fabric.mod.json, so Loader discovers it as a mod in the gametest run.
    testImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:${project.gametest_version}"
}

// Unit tests exercise the pure state/config classes against the same libraries
// (DataFixerUpper, Gson) the mod compiles against.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs << '-Xlint:deprecation'
}

java {
    // 26.1 requires Java 25. Gradle will provision it via the foojay toolchain resolver
    // (see settings.gradle) if no JDK 25 is installed on the machine.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Modrinth publishing via the Mod Publish Plugin, using the same MODRINTH_TOKEN env var as the other mods.
// Without that token (local runs) it dry-runs: the config is validated and the jar built, nothing uploads.
// The Modrinth listing must exist first; put its id in gradle.properties as `modrinth_id`, then run
// `./gradlew publishMods` with MODRINTH_TOKEN set.
publishMods {
    file = tasks.jar.archiveFile
    version = project.version.toString()
    type = me.modmuss50.mpp.ReleaseType.STABLE
    displayName = "Solace ${project.mod_version} (MC ${project.minecraft_version})"
    modLoaders.add("fabric")
    // The Modrinth changelog is this mod_version's "## <version>" section of CHANGELOG.md.
    def notes = (file('CHANGELOG.md').text =~ /(?s)## \Q${project.mod_version}\E\s*\n(.*?)(?=\n## |\z)/)
    changelog = notes.find() ? notes.group(1).trim() : "See the project page for the change list."
    dryRun = !providers.environmentVariable("MODRINTH_TOKEN").isPresent()

    if (project.findProperty("modrinth_id")) {
        modrinth {
            projectId = project.modrinth_id
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            minecraftVersions.add(project.minecraft_version)
            requires("fabric-api")
            optional("modmenu")
            optional("cloth-config")
        }
    }
}
