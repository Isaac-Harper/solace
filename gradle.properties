# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric — check current versions at https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.11

# Mod
mod_version=1.0.0
maven_group=net.solace

# Dependencies
fabric_api_version=0.152.2+26.2

# Client-only GUI deps (Mod Menu + Cloth Config), 26.2-compatible builds
modmenu_version=20.0.0-alpha.1
cloth_config_version=26.2.155

# Tests
junit_version=5.11.4
# Fabric GameTest API: not part of the fabric-api bundle on 26.2, so declared explicitly.
# Version is the one fabric-api 0.152.2+26.2 depends on (from its POM).
gametest_version=4.0.21+4a7fa0819e

# Modrinth project id (slug: solace-mod). Publish a version with `./gradlew publishMods` and
# MODRINTH_TOKEN set (see .env). The listing must exist first; paste its id here once created.
modrinth_id=6bhLd12e
